# Stack completo de la app: Postgres + backend (API/agente/WhatsApp) + dashboard.
#
# Uso:
#   cp .env.example .env    # completar ANTHROPIC_API_KEY, JWT_SECRET, etc.
#   docker login ghcr.io -u <usuario>   # si los packages son privados
#   docker compose pull && docker compose up -d
#   # crear el usuario admin del dashboard:
#   docker compose exec backend npm run seed:admin
#
# Usa las imágenes publicadas en GHCR (las construye el workflow
# .github/workflows/docker-publish.yml). Antes de levantar:
#   docker login ghcr.io -u <usuario>   # si los packages son privados
#   docker compose pull && docker compose up -d
# Podés fijar una versión con IMAGE_TAG (por defecto: latest).
# Para construir localmente en cambio:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stop}
      POSTGRES_DB: ${POSTGRES_DB:-escuelastop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./packages/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stop} -d ${POSTGRES_DB:-escuelastop}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${REGISTRY:-ghcr.io/pel-matiasvaldivia/escuelastop}-backend:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-stop}:${POSTGRES_PASSWORD:-stop}@db:5432/${POSTGRES_DB:-escuelastop}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:-http://localhost:3000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      FORM_BASE_URL: ${FORM_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-cambiar-en-produccion}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-12}
      # Si se definen, el backend crea/actualiza este admin al arrancar.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      # Mail (notificaciones al alumno). Vacío = mail deshabilitado (solo WhatsApp).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      WA_ENABLED: ${WA_ENABLED:-false}
      WA_LOG_LEVEL: ${WA_LOG_LEVEL:-silent}
    ports:
      - "${PORT}:3001"
    volumes:
      - uploads:/app/packages/backend/uploads
      - wa_session:/app/packages/backend/whatsapp-session
    healthcheck:
      # Usa el endpoint /health de la API (la imagen no trae curl/wget).
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  dashboard:
    image: ${REGISTRY:-ghcr.io/pel-matiasvaldivia/escuelastop}-dashboard:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
  wa_session:
